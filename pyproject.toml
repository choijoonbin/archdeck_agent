[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "archdeck-agent"
version = "0.1.0"
description = "Evidence-linked research workflow scaffold for ArchDeck"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.140,<1",
  "httpx>=0.28,<0.29",
  "langgraph>=1,<2",
  "langsmith>=0.16,<1",
  "pydantic>=2.12,<3",
  "uvicorn>=0.52,<1",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]

[project.scripts]
archdeck-agent-eval = "archdeck_agent.evaluate:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
